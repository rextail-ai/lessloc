.lb{fill:#b3ec64}.gb{fill:#8d99a8}
.lr{stroke:#8ed13f}.tr{stroke:#e5e9ee}.ck{stroke:#243040}.tb{fill:#e5e9ee}.dot{fill:#243040}
@media all{
.ink{fill:#e4f1f4}.mut{fill:#9aa8b8}.lt{fill:#bdf86c}
.lb{fill:#b3ec64}.gb{fill:#5d6879}
.lr{stroke:#b3ec64}.tr{stroke:#1f2834}.tb{fill:#1f2834}.dot{fill:#e4f1f4}}
</style>
