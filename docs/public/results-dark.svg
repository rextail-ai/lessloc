<svg xmlns="http://www.w3.org/2000/svg" width="880" height="628" viewBox="0 0 880 628" role="img" aria-labelledby="t d">
<title id="t">lessloc: 27% less code, 23% lower cost, same results</title>
<desc id="d">lessloc 0.10.0 against no tool, Claude Code with Haiku, 117 real merged changes from three open-source Python projects, each task run twice per setup and judged by the project's own tests for that change, hidden from the agent. Per task: production lines 15.2 with no tool vs 11.1 with lessloc, 27% less; cost $0.0202 vs $0.0156, 23% lower; tasks passed: the same, with no measurable difference; earlier changes broken 0.37 vs 0.32 per task.</desc>
