<svg xmlns="http://www.w3.org/2000/svg" width="880" height="784" viewBox="0 0 880 784" role="img" aria-labelledby="t d">
<title id="t">How lessloc works: inside your agent's own loop</title>
<desc id="d">lessloc runs inside the agent's own loop, through the hooks the agent tool already has. At session start it adds a short working standard. When a word of the prompt names existing code, it points to the places that may already do part of the task. Before a write it refuses placeholders and junk files. Right after a write it flags secrets and swallowed errors. At the end of the turn it reviews the change and sends unfinished work back to the agent, once. Principles: the least code that stays correct, reuse before new code, act in the agent's loop with no reports, the agent's own test runs as proof, review only the change. Built on: Node.js with no dependencies, no API key and no model calls, git for snapshots, one table for more than 20 agent tools, a code index for 16 languages.</desc>
