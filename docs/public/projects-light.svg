<svg xmlns="http://www.w3.org/2000/svg" width="880" height="422" viewBox="0 0 880 422" role="img" aria-labelledby="t d">
<title id="t">lessloc: less code and lower cost on every project tested</title>
<desc id="d">lessloc 0.10.0 against no tool, Claude Code with Haiku, per task, on each of three open-source Python projects: 23% to 36% less production code and 15% to 26% lower cost.</desc>
