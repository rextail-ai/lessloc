<circle class="dot" cx="557.6" cy="130" r="9" opacity="1"><animate attributeName="opacity" begin="0s" dur="1.20s" values="0;0;1" keyTimes="0;0.75;1" fill="freeze"/></circle>
<circle class="dot" cx="591.2" cy="130" r="9" opacity="1"><animate attributeName="opacity" begin="0s" dur="1.32s" values="0;0;1" keyTimes="0;0.7727;1" fill="freeze"/></circle>
<circle class="dot" cx="703.2" cy="130" r="9" opacity="1"><animate attributeName="opacity" begin="0s" dur="1.44s" values="0;0;1" keyTimes="0;0.7917;1" fill="freeze"/></circle>
<text class="mut" x="300.0" y="176" font-size="20" text-anchor="middle">0%</text>
