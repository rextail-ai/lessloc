<text class="mut" x="860.0" y="176" font-size="20" text-anchor="middle">50%</text>
<g opacity="1"><animate attributeName="opacity" begin="0s" dur="1.05s" values="0;0;1" keyTimes="0;0.5238;1" fill="freeze"/><text class="lt" x="0" y="294" font-size="52" font-weight="800">15–26%</text><text class="ink" x="0" y="334" font-size="28" font-weight="600">lower cost</text></g>
<rect class="tb" x="300" y="272" width="560" height="16" rx="8"/>
