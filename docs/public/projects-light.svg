<svg xmlns="http://www.w3.org/2000/svg" width="880" height="636" viewBox="0 0 880 636" role="img" aria-labelledby="t d">
<title id="t">lessloc: less code and lower cost on every project</title>
<desc id="d">lessloc 0.10.0 against no tool, Claude Code with Haiku, production lines and cost per task on each of three open-source Python projects. starlette, 43 tasks: 26% less code, 26% lower cost. pydantic-settings, 45 tasks: 23% less code, 22% lower cost. w3lib, 29 tasks: 36% less code, 15% lower cost.</desc>
