# Builds lessloc.org from docs/ and deploys it with GitHub Pages (Pages source: GitHub Actions). Forks skip it. The build,
# which installs the docs' packages, can only read; only the deploy job, which runs nothing else, can publish the site.
name: site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'rextail-ai/lessloc'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      # The whole history, so each page's last update, in its footer and the sitemap, is its own last commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --prefix docs
      - run: npm run build --prefix docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
